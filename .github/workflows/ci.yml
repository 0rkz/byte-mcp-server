name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci || npm install

      - name: Version-claim gate
        run: npm run check:versions

      - name: Version-claim gate self-test
        run: npm run test:gate

      - name: Build
        run: npm run build

      - name: E2E test (read-only — no PRIVATE_KEY needed)
        run: npm test
